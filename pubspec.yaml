name: replylikeme
description: >-
  Suggests WhatsApp replies written in your own texting style, learned from
  your own chat exports. All chat data stays on the device.
publish_to: "none"
version: 0.14.0+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Networking (OpenAI REST API is called directly)
  http: ^1.6.0

  # Storage
  flutter_secure_storage: ^11.2.0   # API key only
  sqflite: ^2.4.4                   # style-memory vectors
  shared_preferences: ^2.5.5        # non-secret settings
  path: ^1.9.1
  path_provider: ^2.1.6

  # Import / pick
  file_picker: ^13.1.0              # pick .txt / .zip export
  image_picker: ^1.2.3              # pick conversation screenshot
  archive: ^4.3.0                   # read WhatsApp .zip exports
  receive_sharing_intent: ^1.9.0    # Android/iOS share sheet
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    # The logo, drawn in the app. The launcher icons are generated from
    # assets/branding/ditto-icon.svg into the Android and iOS projects.
    - assets/branding/ditto-icon-512.png

  fonts:
    # Nunito, the app's one family, bundled rather than fetched at runtime so
    # the app renders correctly offline. Latin subset, from Google Fonts under
    # the SIL Open Font License (assets/fonts/Nunito-OFL.txt).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
